<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yatri Kumbhani — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500;600;700&family=Archivo:wdth,wght@62..125,400..900&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html{scroll-behavior:smooth}
  body{margin:0;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  img{display:block;max-width:100%}
  .dir-pill{position:fixed;left:16px;bottom:16px;z-index:150;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(20,20,20,.86);backdrop-filter:blur(10px);font:500 12px 'JetBrains Mono',monospace;box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .dir-pill button{border:0;background:transparent;color:#bbb;padding:8px 12px;border-radius:999px;cursor:pointer;font:inherit;letter-spacing:.04em}
  .dir-pill button.on{background:#fff;color:#111}
  .dir-pill button:hover:not(.on){color:#fff}
</style>
</head>
<body style="font-family: Lato, sans-serif">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="tweaks_panel.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="dirA.jsx"></script>
<script type="text/babel" src="dirB.jsx"></script>
<script type="text/babel" src="dirC.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "direction": "broadcast",
  "mode": "dark"
}/*EDITMODE-END*/;

const DIRS = [
  { id: 'editorial', label: 'A · Editorial' },
  { id: 'broadcast', label: 'B · Broadcast' },
  { id: 'studio', label: 'C · Studio' },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const dir = t.direction;

  useEffect(() => { window.scrollTo(0, 0); }, [dir]);

  const Comp = dir === 'broadcast' ? DirBroadcast : dir === 'studio' ? DirStudio : DirEditorial;
  return (
    <div data-mode={t.mode}>
      <style>{PM_CSS}</style>
      <Comp key={dir} />
      <div className="dir-pill" role="tablist" aria-label="Design direction">
        {DIRS.map((d) => (
          <button key={d.id} className={dir === d.id ? 'on' : ''} onClick={() => setTweak('direction', d.id)}>{d.label}</button>
        ))}
      </div>
      <TweaksPanel>
        <TweakSection label="Direction">
          <TweakSelect label="Design" value={dir} options={DIRS.map((d) => ({ value: d.id, label: d.label }))} onChange={(v) => setTweak('direction', v)} />
        </TweakSection>
        <TweakSection label="Appearance">
          <TweakRadio label="Mode" value={t.mode} options={[{ value: 'native', label: 'Native' }, { value: 'light', label: 'Light' }, { value: 'dark', label: 'Dark' }]} onChange={(v) => setTweak('mode', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
